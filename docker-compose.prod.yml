# PROD overrides — tight resource caps for a lean 24/7 deployment (README §13).
# Use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile live up -d
services:
  engine:
    environment:
      - LOG_LEVEL=INFO
    mem_limit: 768m
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

  mt5:
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
